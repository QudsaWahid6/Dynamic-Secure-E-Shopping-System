<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DesiZaika Checkout</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI;
background:#fff8f3;
}

/* NAVBAR */

nav{
background:#4b1d0f;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
}

nav h2{
color:#ffcf9c;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:#ffcf9c;
}

/* HERO */

.hero{
text-align:center;
padding:70px;
background:linear-gradient(135deg,#7a2f16,#c46b32);
color:white;
}

.hero h1{
font-size:55px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
opacity:.9;
}

/* CHECKOUT CONTAINER */

.checkout-container{
width:85%;
margin:60px auto;
display:flex;
gap:35px;
flex-wrap:wrap;
justify-content:center;
}

/* FORM */

.form-box{
background:white;
width:650px;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.form-box h2{
font-size:35px;
margin-bottom:30px;
color:#7a2f16;
}

.input-group{
margin-bottom:22px;
}

.input-group label{
display:block;
margin-bottom:10px;
font-weight:bold;
color:#4b1d0f;
}

.input-group input,
.input-group textarea,
.input-group select{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
}

.input-group textarea{
height:120px;
resize:none;
}

/* ORDER SUMMARY */

.summary{
background:white;
width:320px;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
height:fit-content;
}

.summary h2{
color:#7a2f16;
margin-bottom:25px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin:18px 0;
font-size:18px;
}

.total{
font-size:28px;
font-weight:bold;
color:#c46b32;
margin-top:25px;
}

/* BUTTON */

.place-btn{
width:100%;
margin-top:30px;
background:#7a2f16;
color:white;
border:none;
padding:17px;
font-size:18px;
font-weight:bold;
border-radius:14px;
cursor:pointer;
transition:.3s;
}

.place-btn:hover{
background:#c46b32;
}

/* SUCCESS MESSAGE */

.success{
display:none;
margin-top:25px;
background:#e8ffe8;
color:#1f7a1f;
padding:18px;
border-radius:12px;
font-weight:bold;
text-align:center;
}

/* FOOTER */

footer{
margin-top:70px;
background:#2d1209;
color:white;
text-align:center;
padding:35px;
}

</style>

</head>
<body>

<!-- NAVBAR -->

<nav>

<h2>🍛 DesiZaika</h2>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="menu.html">Menu</a></li>
<li><a href="feedback.html">Feedback</a></li>
</ul>

</nav>

<!-- HERO -->

<section class="hero">

<h1>Checkout</h1>

<p>
Complete your order details and enjoy delicious desi food
</p>

</section>

<!-- CHECKOUT -->

<div class="checkout-container">

<!-- FORM -->

<div class="form-box">

<h2>Delivery Information</h2>

<form onsubmit="placeOrder(event)">

<div class="input-group">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" required>
</div>

<div class="input-group">
<label>Delivery Address</label>
<textarea required></textarea>
</div>

<div class="input-group">
<label>Payment Method</label>

<select required>
<option>Cash On Delivery</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Online Payment</option>
</select>

</div>

<button class="place-btn">
Place Order
</button>

</form>

<div class="success" id="successMessage">
✅ Your order has been placed successfully!
</div>

</div>

<!-- SUMMARY -->

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-item">
<span>Subtotal</span>
<span id="subtotal">$0</span>
</div>

<div class="summary-item">
<span>Delivery Fee</span>
<span>$4</span>
</div>

<div class="summary-item">
<span>Tax</span>
<span>$2</span>
</div>

<div class="total" id="total">
Total: $0
</div>

</div>

</div>

<!-- FOOTER -->

<footer>

DesiZaika Dynamic Restaurant Template

</footer>

<script>

let cart =
JSON.parse(localStorage.getItem("cart"))
|| [];

let subtotal = 0;

cart.forEach(item=>{

subtotal += item.price;

});

document.getElementById(
"subtotal"
).innerHTML =
"$" + subtotal;

let finalTotal = subtotal + 4 + 2;

document.getElementById(
"total"
).innerHTML =
"Total: $" + finalTotal;

function placeOrder(event){

event.preventDefault();

document.getElementById(
"successMessage"
).style.display="block";

localStorage.removeItem("cart");

}

</script>

</body>
</html>
