<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DesiZaika Cart</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI;
background:#fff8f3;
}

/* NAVBAR */

nav{
background:#4b1d0f;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
}

nav h2{
color:#ffcf9c;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:#ffcf9c;
}

/* HERO */

.hero{
text-align:center;
padding:70px;
background:linear-gradient(135deg,#7a2f16,#c46b32);
color:white;
}

.hero h1{
font-size:55px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
opacity:.9;
}

/* CART CONTAINER */

.cart-container{
width:85%;
margin:60px auto;
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

/* LEFT SIDE */

.cart-box{
background:white;
width:700px;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.cart-title{
font-size:35px;
color:#7a2f16;
margin-bottom:30px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 0;
border-bottom:1px solid #eee;
}

.item h3{
color:#4b1d0f;
margin-bottom:8px;
}

.price{
font-size:22px;
font-weight:bold;
color:#c46b32;
margin-bottom:10px;
}

.remove-btn{
background:#b22222;
color:white;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* SUMMARY */

.summary{
background:white;
width:320px;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
height:fit-content;
}

.summary h2{
color:#7a2f16;
margin-bottom:25px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin:18px 0;
font-size:18px;
}

.total{
font-size:28px;
font-weight:bold;
color:#c46b32;
margin-top:25px;
}

.checkout-btn{
display:block;
margin-top:30px;
background:#7a2f16;
color:white;
text-align:center;
padding:16px;
border-radius:14px;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

.checkout-btn:hover{
background:#c46b32;
}

.offer{
margin-top:30px;
background:#fff3db;
padding:18px;
border-radius:15px;
color:#7a2f16;
font-weight:bold;
text-align:center;
}

.empty{
text-align:center;
font-size:26px;
padding:50px;
color:#888;
}

/* FOOTER */

footer{
margin-top:70px;
background:#2d1209;
color:white;
text-align:center;
padding:35px;
}

</style>

</head>
<body>

<!-- NAVBAR -->

<nav>

<h2>🍛 DesiZaika</h2>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="menu.html">Menu</a></li>
<li><a href="feedback.html">Feedback</a></li>
</ul>

</nav>

<!-- HERO -->

<section class="hero">

<h1>Your Cart</h1>

<p>
Review your delicious desi order before checkout
</p>

</section>

<!-- CART -->

<div class="cart-container">

<!-- LEFT -->

<div class="cart-box">

<h2 class="cart-title">
Selected Dishes
</h2>

<div id="cartItems"></div>

</div>

<!-- SUMMARY -->

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-item">
<span>Subtotal</span>
<span id="subtotal">$0</span>
</div>

<div class="summary-item">
<span>Delivery Fee</span>
<span>$4</span>
</div>

<div class="summary-item">
<span>Tax</span>
<span>$2</span>
</div>

<div class="total" id="total">
Total: $0
</div>

<a href="checkout.html" class="checkout-btn">
Proceed To Checkout
</a>

<div class="offer">
🔥 Free Dessert On Orders Above $50
</div>

</div>

</div>

<!-- FOOTER -->

<footer>

DesiZaika Dynamic Restaurant Template

</footer>

<script>

let cart =
JSON.parse(localStorage.getItem("cart"))
|| [];

let cartItems =
document.getElementById("cartItems");

let subtotal = 0;

function renderCart(){

cartItems.innerHTML = "";

subtotal = 0;

if(cart.length===0){

cartItems.innerHTML = `
<div class="empty">
🛒 Your Cart Is Empty
</div>
`;

document.getElementById(
"subtotal"
).innerHTML="$0";

document.getElementById(
"total"
).innerHTML="Total: $0";

return;

}

cart.forEach((item,index)=>{

subtotal += item.price;

cartItems.innerHTML += `

<div class="item">

<div>

<h3>${item.name}</h3>

<p>
Delicious desi special item
</p>

</div>

<div>

<div class="price">
$${item.price}
</div>

<button class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>

</div>

</div>

`;

});

document.getElementById(
"subtotal"
).innerHTML =
"$" + subtotal;

let finalTotal = subtotal + 4 + 2;

document.getElementById(
"total"
).innerHTML =
"Total: $" + finalTotal;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

renderCart();

</script>

</body>
</html>
