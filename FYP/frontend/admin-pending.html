<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management</title>
<link rel="stylesheet" href="css/erp.css">
</head>
<body>
<div id="page-root">
  <div class="erp-panel">
    <h2>⏳ Pending Store Owner Approvals</h2>
    <div id="alertArea"></div>
    <div id="pendingList"></div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
initERPLayout({ title: "Pending Approvals", activePage: "admin-pending.html", allowedRoles: ["super_admin"] });

async function loadPending() {
  const res = await apiRequest("/admin/users/pending");
  const el = document.getElementById("pendingList");
  if (!res.success || !res.data.length) {
    el.innerHTML = '<div class="erp-empty">No pending approvals</div>'; return;
  }
  el.innerHTML = res.data.map(u => `
    <div class="erp-card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div>
        <div style="font-weight:600">${u.name}</div>
        <div style="color:#94a3b8;font-size:0.85rem">${u.email}</div>
        <div style="color:#64748b;font-size:0.78rem">Registered: ${new Date(u.created_at).toLocaleDateString()}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="erp-btn erp-btn-primary" onclick="approveUser('${u.id}')">Approve</button>
        <button class="erp-btn" style="background:#7f1d1d;color:#fff" onclick="rejectUser('${u.id}')">Reject</button>
      </div>
    </div>
  `).join("");
}

async function approveUser(id) {
  const res = await apiRequest(`/admin/users/${id}/approve`, "PATCH");
  if (res.success) { showAlert(document.getElementById("alertArea"), "Approved!", "success"); loadPending(); }
}

async function rejectUser(id) {
  const res = await apiRequest(`/admin/users/${id}/reject`, "PATCH");
  if (res.success) { showAlert(document.getElementById("alertArea"), "Rejected.", "success"); loadPending(); }
}

loadPending();
</script>
</body>
</html>
