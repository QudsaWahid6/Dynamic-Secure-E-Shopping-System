<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - Dynamic E-Shopping</title>
<link rel="stylesheet" href="css/public-nav.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(180deg,#0B1020 0%,#111827 65%,#0F172A 100%);
}

/* background glow */
body::before{
content:"";
position:absolute;
width:450px;
height:450px;
background:#2563EB;
filter:blur(170px);
opacity:.18;
top:-120px;
left:-120px;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:#06B6D4;
filter:blur(170px);
opacity:.16;
bottom:-120px;
right:-100px;
}

.container{
position:relative;
z-index:2;
display:flex;
width:950px;
height:540px;
background:rgba(17,24,39,.88);
backdrop-filter:blur(20px);
border:1px solid rgba(56,189,248,.15);
border-radius:28px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

/* LEFT PANEL */
.left{
flex:1;
padding:70px;
display:flex;
flex-direction:column;
justify-content:center;
background:linear-gradient(
135deg,
rgba(37,99,235,.18),
rgba(6,182,212,.10)
);
}

.left h1{
font-size:46px;
line-height:1.2;
margin-bottom:20px;
background:linear-gradient(90deg,#38BDF8,#2563EB);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.left p{
font-size:18px;
line-height:1.8;
color:#cbd5e1;
max-width:430px;
}

.left::after{
content:"AI Powered Commerce";
margin-top:30px;
display:inline-block;
width:max-content;
padding:12px 22px;
border-radius:30px;
border:1px solid rgba(56,189,248,.3);
color:#38BDF8;
font-size:14px;
}

/* RIGHT PANEL */
.right{
flex:1;
background:#ffffff;
padding:70px;
display:flex;
justify-content:center;
flex-direction:column;
}

.right h2{
font-size:38px;
margin-bottom:30px;
background:linear-gradient(90deg,#2563EB,#06B6D4);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.input-box{
margin-bottom:18px;
}

.input-box input{
width:100%;
padding:16px 18px;
border:1px solid #dbeafe;
border-radius:14px;
font-size:15px;
outline:none;
transition:.3s;
}

.input-box input:focus{
border-color:#38BDF8;
box-shadow:0 0 0 4px rgba(56,189,248,.12);
}

.login-btn{
margin-top:12px;
padding:16px;
border:none;
width:100%;
font-weight:600;
font-size:16px;
color:white;
border-radius:14px;
cursor:pointer;
background:linear-gradient(90deg,#2563EB,#06B6D4);
box-shadow:0 8px 25px rgba(37,99,235,.25);
transition:.3s;
}

.login-btn:hover{
transform:translateY(-3px);
}

.register-link{
margin-top:20px;
text-align:center;
color:#64748B;
}

.register-link a{
text-decoration:none;
font-weight:600;
color:#2563EB;
}

/* Responsive */
@media(max-width:900px){

.container{
flex-direction:column;
width:92%;
height:auto;
}

.left,
.right{
padding:50px 35px;
}

.left h1{
font-size:38px;
}

}

</style>
</head>

<body class="auth-page">

<nav class="landing-nav">
  <a href="index.html" class="logo">ERP Commerce AI</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#features">Features</a>
    <a href="index.html#ai">AI Themes</a>
    <a href="login.html" class="active">Login</a>
    <a href="register.html" class="nav-cta">Register</a>
  </div>
</nav>

<div class="auth-page-wrap">
<div class="container">

<div class="left">
<h1>Welcome Back</h1>

<p>
Login to access your dashboard and start building your dynamic e-commerce platform.
</p>
</div>


<div class="right">

<h2>Login</h2>
<div class="input-box">
<input id="email" type="email" placeholder="Email">
</div>

<div class="input-box">
<input id="password" type="password" placeholder="Password">
</div>

<button id="loginBtn" class="login-btn">
Login
</button>

<div class="register-link">
Don’t have an account?
<a href="register.html">Register</a>
</div>

</div>

</div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>

document.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        alert("Please enter email and password");
        return;
    }

    try {

        const response =
            await loginUser(email, password);
        
        if (response.success) {

            saveSession(response.token, response.user);
            redirectByRole(response.user.role);

        } else {

            alert(
                response.error ||
                response.message ||
                "Login failed"
            );
        }

    } catch (error) {

        console.error(error);

        alert("Server error");
    }

});

</script>

</body>
</html>
