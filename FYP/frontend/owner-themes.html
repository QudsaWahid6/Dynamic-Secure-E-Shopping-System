<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Management - Store Owner</title>
<link rel="stylesheet" href="css/erp.css">
</head>
<body>
<div id="page-root">
  <div class="erp-toolbar">
    <a href="owner-theme-generator.html" class="erp-btn erp-btn-primary">Generate New Theme</a>
    <a href="owner-theme-library.html" class="erp-btn erp-btn-secondary">Theme Library</a>
    <a href="store-live.html" class="erp-btn erp-btn-secondary" id="liveStoreLink">View Live Storefront ↗</a>
  </div>
  <div class="erp-panel"><h2>Your Store Themes</h2><div id="themeList"></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/theme.js"></script>
<script>
const user = initERPLayout({ title: "Theme Management", activePage: "owner-themes.html", allowedRoles: ["store_owner"] });
if (user) {
  getDashboard().then(dash => {
    if (!dash.success) {
      document.getElementById("themeList").innerHTML = '<div class="erp-empty">Create a store first.</div>';
      return;
    }
    document.getElementById("liveStoreLink").href = `store-live.html?store_id=${dash.store.id}`;
    getThemes(dash.store.id).then(res => renderThemeCards(document.getElementById("themeList"), res.data || []));
  });
}
</script>
</body>
</html>
