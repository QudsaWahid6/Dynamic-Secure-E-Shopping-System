<!DOCTYPE html>
<html>
<head>
<title>Feedback</title>

<style>

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#e8a4b8,#9bb6e8);
padding:70px;
}

.box{
background:#0d1028;
color:white;
width:650px;
margin:auto;
padding:45px;
border-radius:25px;
}

textarea{
width:100%;
height:180px;
border:none;
border-radius:12px;
padding:15px;
}

button{
margin-top:25px;
background:#ff5f7d;
color:white;
padding:15px 30px;
border:none;
border-radius:12px;
}

</style>
</head>

<body>

<div class="box">

<h1>Customer Feedback</h1>

<p>Rate this template preview</p>

<textarea placeholder="Write your review..."></textarea>

<br>

<button>
Submit Review
</button>

</div>

</body>
</html>
