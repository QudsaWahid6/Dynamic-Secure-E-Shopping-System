<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>
<link rel="stylesheet" href="css/erp.css">
</head>
<body>
<div id="page-root">
  <div class="erp-panel"><h2>My Wishlist</h2><div id="wishlist"></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/orders.js"></script>
<script>
initERPLayout({ title: "Wishlist", activePage: "customer-wishlist.html", allowedRoles: ["customer"] });
async function load() {
  const res = await getWishlist();
  const el = document.getElementById("wishlist");
  if (!res.data?.length) { el.innerHTML = '<div class="erp-empty">Wishlist is empty</div>'; return; }
  el.innerHTML = res.data.map((w, i) => {
    const p = w.products || {};
    return `<div class="erp-card wish-item" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center" data-idx="${i}">
      <div><strong>${p.name||"Product"}</strong><br><span style="color:#94a3b8">${formatPrice(p.price)}</span></div>
      <div style="display:flex;gap:8px">
        <button class="erp-btn erp-btn-primary erp-btn-sm btn-add-cart">Add to Cart</button>
        <button class="erp-btn erp-btn-danger erp-btn-sm" data-rm="${w.id}">Remove</button>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-rm]").forEach(btn => btn.addEventListener("click", async () => { await removeFromWishlist(btn.dataset.rm); load(); }));
  el.querySelectorAll(".wish-item").forEach((card, i) => {
    const w = res.data[i];
    const p = w.products || {};
    card.querySelector(".btn-add-cart").addEventListener("click", () => {
      addToCart({ id: p.id, name: p.name, price: p.price }, p.store_id);
      alert("Added to cart");
    });
  });
}
load();
</script>
</body>
</html>
