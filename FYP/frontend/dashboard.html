<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
</head>
<body>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const user = getUser();
const token = getToken();
if (!token || !user) {
  window.location.href = "login.html";
} else {
  redirectByRole(user.role);
}
</script>
</body>
</html>
