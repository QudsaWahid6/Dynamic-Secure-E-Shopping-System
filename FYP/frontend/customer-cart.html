<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>
<link rel="stylesheet" href="css/erp.css">
<style>
  .pay-store-card {
    background: #1e293b;
    border: 1px solid rgba(148,163,184,0.15);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .pay-store-card h4 { margin: 0 0 10px; font-size: 0.95rem; color: #f1f5f9; }
  .pay-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(148,163,184,0.15);
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    color: #cbd5e1;
  }
  .pay-option.locked { cursor: default; opacity: 0.85; }
  .pay-option input { accent-color: #38bdf8; }
  .bank-details {
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(56,189,248,0.08);
    font-size: 0.8rem;
    color: #94a3b8;
    line-height: 1.6;
  }
  .bank-details b { color: #e2e8f0; }
  .receipt-upload-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .receipt-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid rgba(148,163,184,0.2);
  }
  .receipt-status { font-size: 0.78rem; }
  .receipt-status.ok { color: #4ade80; }
  .receipt-status.pending { color: #fbbf24; }
  .receipt-status.err { color: #f87171; }
</style>
</head>
<body>
<div id="page-root">
  <div id="alertArea"></div>
  <div class="erp-panel"><h2>Shopping Cart</h2><div id="cartList"></div>
    <div id="paymentSection" style="margin-top:18px"></div>
    <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
      <strong id="cartTotal">Total: $0.00</strong>
      <button class="erp-btn erp-btn-primary" id="checkoutBtn">Place Order</button>
      <button class="erp-btn erp-btn-secondary" id="clearBtn">Clear Cart</button>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/orders.js"></script>
<script>
initERPLayout({ title: "Cart", activePage: "customer-cart.html", allowedRoles: ["customer"] });
const alertArea = document.getElementById("alertArea");

// store_id -> { name, payment_options, bank_account_title, bank_account_number, bank_name, currency }
const storeMeta = {};
// store_id -> "cod" | "online"
const paymentChoice = {};
// store_id -> uploaded receipt image url
const receiptUrls = {};
// store_id -> true while an upload is in progress
const uploading = {};

function render() {
  const cart = getCart();
  const el = document.getElementById("cartList");
  if (!cart.length) {
    el.innerHTML = '<div class="erp-empty">Your cart is empty. <a href="customer-stores.html" style="color:#38bdf8">Browse stores</a></div>';
    document.getElementById("cartTotal").textContent = "Total: $0.00";
    document.getElementById("paymentSection").innerHTML = "";
    return;
  }
  let total = 0;
  el.innerHTML = cart.map((i, idx) => {
    total += i.price * i.quantity;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span style="flex:1">${i.name} — ${formatPrice(i.price * i.quantity)}</span>
      <button class="erp-btn erp-btn-secondary erp-btn-sm" data-dec="${idx}">−</button>
      <span>${i.quantity}</span>
      <button class="erp-btn erp-btn-secondary erp-btn-sm" data-inc="${idx}">+</button>
      <button class="erp-btn erp-btn-danger erp-btn-sm" data-rm="${idx}">Remove</button>
    </div>`;
  }).join("");
  document.getElementById("cartTotal").textContent = `Total: ${formatPrice(total)}`;
  el.querySelectorAll("[data-rm]").forEach(btn => btn.addEventListener("click", () => { const c = getCart(); c.splice(btn.dataset.rm, 1); saveCart(c); render(); }));
  el.querySelectorAll("[data-inc]").forEach(btn => btn.addEventListener("click", () => { const c = getCart(); c[btn.dataset.inc].quantity += 1; saveCart(c); render(); }));
  el.querySelectorAll("[data-dec]").forEach(btn => btn.addEventListener("click", () => { const c = getCart(); if (c[btn.dataset.dec].quantity > 1) { c[btn.dataset.dec].quantity -= 1; saveCart(c); render(); } }));

  loadPaymentSection(cart);
}

async function loadPaymentSection(cart) {
  const storeIds = [...new Set(cart.map(i => i.store_id).filter(Boolean))];
  const section = document.getElementById("paymentSection");

  if (!storeIds.length) { section.innerHTML = ""; return; }

  const missing = storeIds.filter(id => !storeMeta[id]);
  if (missing.length) {
    section.innerHTML = `<div class="erp-empty">Loading payment options...</div>`;
    const storesRes = await getStores().catch(() => ({ data: [] }));
    const nameMap = {};
    (storesRes.data || []).forEach(s => { nameMap[s.id] = s.name; });

    await Promise.all(missing.map(async (id) => {
      const info = await getStorePaymentInfo(id).catch(() => null);
      storeMeta[id] = {
        name: nameMap[id] || "Store",
        payment_options: (info && info.success && info.data && info.data.payment_options) || "cod",
        bank_account_title: info && info.data && info.data.bank_account_title,
        bank_account_number: info && info.data && info.data.bank_account_number,
        bank_name: info && info.data && info.data.bank_name,
        currency: info && info.data && info.data.currency,
      };
      // default selection: cod unless the store only accepts online
      if (!paymentChoice[id]) {
        paymentChoice[id] = storeMeta[id].payment_options === "online" ? "online" : "cod";
      }
    }));
  }

  renderPaymentSection(storeIds);
}

function renderPaymentSection(storeIds) {
  const section = document.getElementById("paymentSection");
  section.innerHTML = `<h3 style="font-size:0.95rem;color:#e2e8f0;margin-bottom:10px">Payment Method</h3>` +
    storeIds.map(id => {
      const meta = storeMeta[id];
      if (!meta) return "";
      const opts = meta.payment_options; // "cod" | "online" | "both"
      const choice = paymentChoice[id];

      let optionsHtml = "";
      if (opts === "cod") {
        optionsHtml = `<div class="pay-option locked">
          <input type="radio" checked disabled> Cash on Delivery
        </div>
        <div style="font-size:0.78rem;color:#64748b">This store only accepts Cash on Delivery.</div>`;
      } else if (opts === "online") {
        optionsHtml = `<div class="pay-option locked">
          <input type="radio" checked disabled> Online Payment
        </div>
        <div style="font-size:0.78rem;color:#64748b">This store only accepts online payment.</div>
        ${renderBankDetails(meta)}
        ${renderReceiptUpload(id)}`;
      } else {
        optionsHtml = `
          <label class="pay-option">
            <input type="radio" name="pay-${id}" value="cod" data-store="${id}" ${choice === "cod" ? "checked" : ""}>
            Cash on Delivery
          </label>
          <label class="pay-option">
            <input type="radio" name="pay-${id}" value="online" data-store="${id}" ${choice === "online" ? "checked" : ""}>
            Online Payment
          </label>
          ${choice === "online" ? renderBankDetails(meta) + renderReceiptUpload(id) : ""}
        `;
      }

      return `<div class="pay-store-card" data-store-card="${id}">
        <h4>🏬 ${meta.name}</h4>
        ${optionsHtml}
      </div>`;
    }).join("");

  section.querySelectorAll("input[type=radio][data-store]").forEach(radio => {
    radio.addEventListener("change", () => {
      paymentChoice[radio.dataset.store] = radio.value;
      renderPaymentSection(storeIds);
    });
  });

  section.querySelectorAll("input[type=file][data-store]").forEach(input => {
    input.addEventListener("change", async () => {
      const storeId = input.dataset.store;
      const file = input.files[0];
      if (!file) return;
      uploading[storeId] = true;
      delete receiptUrls[storeId];
      renderPaymentSection(storeIds);
      const url = await uploadImageToImgBB(file);
      uploading[storeId] = false;
      if (url) {
        receiptUrls[storeId] = url;
      } else {
        showAlert(alertArea, "Failed to upload receipt image. Please try again.");
      }
      renderPaymentSection(storeIds);
    });
  });
}

function renderBankDetails(meta) {
  if (!meta.bank_account_number) {
    return `<div class="bank-details">This store hasn't set up its payment account details yet.</div>`;
  }
  return `<div class="bank-details">
    Send payment to:<br>
    <b>${meta.bank_name || ""}</b> — ${meta.bank_account_title || ""}<br>
    Account #: <b>${meta.bank_account_number}</b>
  </div>`;
}

function renderReceiptUpload(storeId) {
  const isUploading = uploading[storeId];
  const url = receiptUrls[storeId];
  return `<div class="receipt-upload-row">
    <label class="erp-btn erp-btn-secondary erp-btn-sm" style="cursor:pointer">
      📎 Upload Payment Receipt
      <input type="file" accept="image/*" data-store="${storeId}" style="display:none">
    </label>
    ${isUploading ? `<span class="receipt-status pending">Uploading...</span>` : ""}
    ${url ? `<img class="receipt-thumb" src="${url}"><span class="receipt-status ok">✓ Receipt attached</span>` : (!isUploading ? `<span class="receipt-status err">Receipt required for online payment</span>` : "")}
  </div>`;
}

document.getElementById("clearBtn").addEventListener("click", () => { saveCart([]); render(); });
document.getElementById("checkoutBtn").addEventListener("click", async () => {
  const cart = getCart();
  if (!cart.length) return;

  const profile = await getProfile();
  const user = profile.profile || {};
  if (!user.phone || !user.address) {
    showAlert(alertArea, "Please add your phone number and address before checking out.");
    setTimeout(() => { window.location.href = "customer-profile.html"; }, 1500);
    return;
  }

  const storeIds = [...new Set(cart.map(i => i.store_id).filter(Boolean))];
  const payments = {};
  for (const id of storeIds) {
    const method = paymentChoice[id] || "cod";
    if (method === "online") {
      if (uploading[id]) {
        showAlert(alertArea, `Please wait for the receipt upload for "${(storeMeta[id] || {}).name || "a store"}" to finish.`);
        return;
      }
      if (!receiptUrls[id]) {
        showAlert(alertArea, `Please upload a payment receipt for "${(storeMeta[id] || {}).name || "a store"}" before placing the order.`);
        return;
      }
      payments[id] = { payment_method: "online", receipt_image_url: receiptUrls[id] };
    } else {
      payments[id] = { payment_method: "cod" };
    }
  }

  const res = await createOrder({
    items: cart.map(i => ({ product_id: i.product_id, quantity: i.quantity })),
    payments,
  });

  if (res.success) {
    saveCart([]);
    Object.keys(paymentChoice).forEach(k => delete paymentChoice[k]);
    Object.keys(receiptUrls).forEach(k => delete receiptUrls[k]);
    const n = (res.data || []).length;
    showAlert(alertArea, n > 1 ? `Order placed! Split into ${n} orders across ${n} stores.` : "Order placed!", "success");
    render();
  } else if (res.missing_profile_info) {
    showAlert(alertArea, res.message);
    setTimeout(() => { window.location.href = "customer-profile.html"; }, 1500);
  } else {
    showAlert(alertArea, res.error || res.message || "Checkout failed");
  }
});

render();
</script>
</body>
</html>
