<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<link rel="stylesheet" href="css/erp.css">
<style>
.avatar-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
.avatar-circle {
  width: 190px; height: 190px; border-radius: 50%;
  background: #1e293b; border: 3px solid rgba(56,189,248,0.3);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  font-size: 3.5rem; color: #94a3b8;
}
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-edit-btn {
  margin-top: 8px; font-size: 0.78rem; padding: 4px 12px; border-radius: 20px;
  cursor: pointer; background: transparent; border: 1px solid rgba(56,189,248,0.4); color: #38bdf8;
}
.avatar-edit-btn:hover { background: rgba(56,189,248,0.1); }
.avatar-options {
  display: none; background: #1e293b; border: 1px solid rgba(56,189,248,0.15);
  border-radius: 10px; padding: 16px; margin-top: 12px; width: 100%;
}
.avatar-options.open { display: block; }
.avatar-upload-status { font-size: 0.8rem; margin-top: 6px; min-height: 18px; }
</style>
</head>
<body>
<div id="page-root">
  <div class="erp-panel" style="max-width:600px;margin:40px auto">
    <h2>My Profile</h2>
    <div id="alertArea"></div>

    <div class="avatar-wrapper">
      <div class="avatar-circle" id="avatarCircle">
        <img id="avatarImg" alt="Profile">
        <span id="avatarInitial">?</span>
      </div>
      <button class="avatar-edit-btn" id="editAvatarBtn">✏ Edit Photo</button>
      <div class="avatar-options" id="avatarOptions">
        <div class="erp-form-group">
          <label>Paste Image URL</label>
          <input class="erp-input" id="avatarUrl" placeholder="https://...">
          <div class="avatar-upload-status" id="avatarStatus"></div>
        </div>
        <div style="text-align:center;color:#64748b;font-size:0.8rem;margin:8px 0">— or —</div>
        <label class="erp-btn erp-btn-secondary" style="cursor:pointer;display:inline-block;width:100%;text-align:center">
          📁 Upload from device
          <input type="file" id="avatarFile" accept="image/*" style="display:none">
        </label>
      </div>
    </div>

    <div class="erp-form-group"><label>Name</label><input class="erp-input" id="name"></div>
    <div class="erp-form-group"><label>Email</label><input class="erp-input" id="email" disabled></div>
    <div class="erp-form-group"><label>Role</label><input class="erp-input" id="role" disabled></div>
    <div class="erp-form-group"><label>Phone Number</label><input class="erp-input" id="phone" placeholder="e.g. 0300-1234567"></div>
    <div class="erp-form-group"><label>Address</label><input class="erp-input" id="address" placeholder="Delivery address"></div> 
    <button class="erp-btn erp-btn-primary" id="saveBtn">Save Profile</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
const user = initERPLayout({ title: "My Profile", activePage: "customer-profile.html", allowedRoles: ["customer"] });
let currentAvatarUrl = "";

function renderAvatar(url) {
  const img = document.getElementById("avatarImg");
  const initial = document.getElementById("avatarInitial");
  if (url) {
    img.src = url; img.style.display = "block"; initial.style.display = "none";
  } else {
    img.style.display = "none"; initial.style.display = "block";
    initial.textContent = (user && user.name) ? user.name[0].toUpperCase() : "?";
  }
}

if (user) {
  document.getElementById("name").value = user.name || "";
  document.getElementById("email").value = user.email || "";
  document.getElementById("role").value = user.role || "";
  document.getElementById("phone").value = user.phone || "";
  document.getElementById("address").value = user.address || ""; 
  currentAvatarUrl = user.profile_image_url || "";
  document.getElementById("avatarUrl").value = currentAvatarUrl;
  renderAvatar(currentAvatarUrl);
}

document.getElementById("editAvatarBtn").addEventListener("click", () => {
  document.getElementById("avatarOptions").classList.toggle("open");
});

document.getElementById("avatarUrl").addEventListener("input", (e) => {
  const url = e.target.value.trim();
  const status = document.getElementById("avatarStatus");
  if (!url) { status.textContent = ""; currentAvatarUrl = ""; renderAvatar(""); return; }
  status.textContent = "Checking..."; status.style.color = "#94a3b8";
  const testImg = new Image();
  testImg.onload = () => {
    status.style.color = "#22c55e"; status.textContent = "✓ Valid image";
    currentAvatarUrl = url; renderAvatar(url);
  };
  testImg.onerror = () => {
    status.style.color = "#ef4444"; status.textContent = "✗ Invalid image URL";
    currentAvatarUrl = ""; renderAvatar("");
  };
  testImg.src = url;
});

document.getElementById("avatarFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("avatarStatus");
  status.style.color = "#94a3b8"; status.textContent = "Uploading...";
  document.getElementById("avatarUrl").value = "";
  const url = await uploadImageToImgBB(file);
  if (url) {
    currentAvatarUrl = url;
    document.getElementById("avatarUrl").value = url;
    renderAvatar(url);
    status.style.color = "#22c55e"; status.textContent = "✓ Uploaded";
    document.getElementById("avatarOptions").classList.remove("open");
  } else {
    status.style.color = "#ef4444"; status.textContent = "Upload failed — check ImgBB key";
  }
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  const res = await updateProfile({
    name: document.getElementById("name").value.trim(),
    profile_image_url: currentAvatarUrl,
    phone: document.getElementById("phone").value.trim(),
    address: document.getElementById("address").value.trim()
  });
  if (res.success) {
    saveSession(getToken(), { ...user, ...res.profile });
    showAlert(document.getElementById("alertArea"), "Profile updated!", "success");
    const topAvatar = document.querySelector(".erp-avatar");
    if (topAvatar) {
      if (currentAvatarUrl) {
        topAvatar.innerHTML = `<img src="${currentAvatarUrl}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
      } else {
        const n = document.getElementById("name").value.trim();
        topAvatar.textContent = n ? n.slice(0,2).toUpperCase() : "?";
      }
    }
  } else {
    showAlert(document.getElementById("alertArea"), res.error || "Save failed");
  }
});
</script>
</body>
</html>
